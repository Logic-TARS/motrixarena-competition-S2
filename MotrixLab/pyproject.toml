[project]
name = "motrix-lab"
version = "0.3.0"
description = "A general-purpose machine learning architecture designed for robot training"
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
dependencies = [
    "gitpython>=3.1.46",
    "tensordict>=0.11.0",
    "numpy>=1.23",
    "pyzmq>=26",
    "pyyaml>=6",
    "matplotlib>=3.5",
    "transitions>=0.8",
    "flask",
    "flask-socketio",
    "pillow",
    "fastapi",
    "uvicorn",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "autodocsumm",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-subfigure",
    "sphinxcontrib-video",
    "sphinx-togglebutton",
    "sphinx-design",
]

[tool.uv.workspace]
members = ["motrix_envs", "motrix_rl"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
package = false
